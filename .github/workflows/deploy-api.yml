name: Deploy API to Azure

# Manual only: no Azure Web App is provisioned yet, and nothing here should
# run automatically until one exists and AZURE_WEBAPP_PUBLISH_PROFILE is set.
# See the repository README or the PR that introduced this workflow for the
# one-time setup steps.
on:
  workflow_dispatch:
    inputs:
      webapp-name:
        description: "Azure Web App name to deploy to"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish src/Rite.Api/Rite.Api.csproj --configuration Release --output ./publish
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.webapp-name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
